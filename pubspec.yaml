name: tranqui
description: "Mapa colaborativo para negocios que aceptan transferencias en Cuba"
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Mapa
  flutter_map: ^8.3.1
  latlong2: ^0.9.0

  # GPS
  geolocator: ^13.0.1

  # HTTP
  http: ^1.2.0

  # Almacenamiento local
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Conectividad
  connectivity_plus: ^6.0.0

  # Rutas de archivos
  path_provider: ^2.1.0

  # Utilidades
  intl: ^0.19.0

  # URL Launcher
  url_launcher: ^6.3.0

  # Preferencias compartidas
  shared_preferences: ^2.2.3

  # Versión de la app (para update)
  package_info_plus: ^10.2.1

  # APKLIS PAGO (desde GitHub, NO está en pub.dev)
  apklis_license_validator:
    git:
      url: https://github.com/z17-cuba/apklis_license_validator.git
      ref: main

  # Detección de arquitectura (para update)
  device_info_plus: ^13.2.0

  # Caché de tiles del mapa
  flutter_map_cache: ^1.5.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  dio: ^5.4.0

  # ⭐ Compartición
  share_plus: ^13.3.0

  # ⭐ Deep links
  app_links: ^6.3.2

  # ⭐ URLs limpias en web
  url_strategy: ^0.3.0

  # ⭐ NUEVO: Fotos (selector de galería/cámara)
  image_picker: ^1.1.2

  # ⭐ NUEVO: Compresión de imágenes a 250 KB
  flutter_image_compress: ^2.3.0

  # ⭐ NOTIFICACIONES PUSH (Firebase)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generador de íconos
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FF6D00"
  min_sdk_android: 21

# ⭐ Forzar compatibilidad con web ^1.0.0
dependency_overrides:
  web: ^1.0.0