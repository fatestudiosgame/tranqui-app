name: tranqui
description: "Mapa colaborativo para negocios que aceptan transferencias en Cuba"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Mapa
  flutter_map: ^8.3.1
  latlong2: ^0.9.0

  # GPS
  geolocator: ^13.0.1

  # HTTP
  http: ^1.2.0

  # Almacenamiento local
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Conectividad
  connectivity_plus: ^6.0.0

  # Rutas de archivos
  path_provider: ^2.1.0

  # Utilidades
  intl: ^0.19.0

  # URL Launcher
  url_launcher: ^6.3.0

  # Preferencias compartidas
  shared_preferences: ^2.2.3

  # ⭐ Versión de la app (para update)
  package_info_plus: ^10.2.1

  # ⭐ Detección de arquitectura (para update)
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generador de íconos
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FF6D00"
  min_sdk_android: 21

# ⭐ Forzar compatibilidad con web ^1.0.0
dependency_overrides:
  web: ^1.0.0